services:
  web:
    image: nginx:alpine
    environment:
      LANDING_REF: 9297bf6b2ec925b0e281f27e6cdaf14fd8deed28
    command:
      - /bin/sh
      - -c
      - set -e; rm -rf /srv/site /tmp/x; mkdir -p /srv/site /tmp/x; wget -qO /tmp/s.tgz "https://codeload.github.com/faroukibrahem2-lab/courtdeskai-landing/tar.gz/$${LANDING_REF}"; tar xzf /tmp/s.tgz -C /tmp/x; cp -r /tmp/x/*/. /srv/site/; cd /srv/site; sha256sum -c SHA256SUMS > /dev/null; echo "courtdesk landing files OK $${LANDING_REF}"; exec nginx -g 'daemon off;'
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    labels:
      - traefik.enable=true
      - traefik.http.services.courtdesk-landing.loadbalancer.server.port=80
      - traefik.http.routers.courtdesk-landing.rule=Host(`courtdeskai.com`)
      - traefik.http.routers.courtdesk-landing.entrypoints=websecure
      - traefik.http.routers.courtdesk-landing.tls.certresolver=letsencrypt
      - traefik.http.routers.courtdesk-landing.service=courtdesk-landing
      - traefik.http.routers.courtdesk-landing-www.rule=Host(`www.courtdeskai.com`)
      - traefik.http.routers.courtdesk-landing-www.entrypoints=websecure
      - traefik.http.routers.courtdesk-landing-www.tls.certresolver=letsencrypt
      - traefik.http.routers.courtdesk-landing-www.service=courtdesk-landing
      - traefik.http.routers.courtdesk-landing-www.middlewares=courtdesk-www-to-apex
      - traefik.http.middlewares.courtdesk-www-to-apex.redirectregex.regex=^https?://www\\.courtdeskai\\.com/(.*)
      - traefik.http.middlewares.courtdesk-www-to-apex.redirectregex.replacement=https://courtdeskai.com/$${1}
      - traefik.http.middlewares.courtdesk-www-to-apex.redirectregex.permanent=true
    restart: unless-stopped

configs:
  nginx_conf:
    content: |
      server {
        listen 80 default_server;
        server_name _;
        root /srv/site;
        index index.html;
        server_tokens off;
        absolute_redirect off;
        charset utf-8;
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location /assets/ {
          expires 7d;
          try_files $$uri =404;
        }

        location / {
          expires -1;
          try_files $$uri $$uri/ =404;
        }
      }
